model: usage-based
note: >-
  Hnry publishes a single public plan per jurisdiction. There is no subscription tier, no free
  tier and no enterprise "contact us" tier — the whole commercial model is one percentage fee
  taken from each inbound payment into the customer's Hnry Account, with an annual cap and a
  per-payment minimum. The fee is charged only when the customer is paid, and Hnry states it
  automatically claims its own fee as a deductible business expense on the customer's behalf.
  Prices below are quoted verbatim from each jurisdiction's pricing page; no API-metered,
  per-call or developer pricing is published anywhere.
