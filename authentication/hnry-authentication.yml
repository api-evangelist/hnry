observed:
- surface: API reference
  url: https://app.hnry.io/api-docs
  status: 401
  scheme: HTTP Basic
  detail: >-
    Responds `WWW-Authenticate: Basic realm=""` with an empty body. The whole /api-docs/* tree
    behaves identically (/api-docs/, /api-docs/index.html, /api-docs/swagger.json,
    /api-docs/openapi.json all 401), so the documentation itself — not just the API — is
    credential-gated. The same behaviour is present on the UAT host, https://uat.hnry.io/api-docs.
- surface: OAuth authorization endpoint
  url: https://app.hnry.io/oauth/authorize
  status: 302
  location: https://app.hnry.io/users/sign_in?mode=api
  detail: >-
    A live /oauth/authorize route exists and redirects anonymous callers to an API-mode sign-in.
    The `?mode=api` parameter and the Rails/Doorkeeper-shaped path are consistent with an
    authorization-code flow, but /oauth/token and /oauth/applications both return 404 anonymously
    and no client-registration, scope or grant-type documentation is published, so the flow cannot
    be characterised further without credentials.
- surface: Zapier integration
  url: https://zapier.com/apps/hnry/integrations
  status: 200
  detail: >-
    Hnry ships a public, non-beta Zapier app in the Accounting category. A Zapier app requires a
    working authentication mechanism against the Hnry API, and Hnry's own help centre documents
    connecting an account, but that article (help.hnry.io/en/articles/5094374) returns 401, so the
    credential type Zapier collects could not be confirmed from a Hnry-published source.
