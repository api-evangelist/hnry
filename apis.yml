apis:
- aid: hnry-platform-api
  name: Hnry Platform API
  description: >-
    The REST API behind the Hnry app. It backs the Hnry iOS/Android clients and the published Hnry
    Zapier integration, which exposes create/find operations over clients, invoices, invoice line
    items and expenses. The reference is served by the platform itself at https://app.hnry.io/api-docs
    but returns HTTP 401 with a WWW-Authenticate: Basic challenge to anonymous callers, and the
    "Developer Platform" page Hnry links from its own short domain (https://on.hnry.co.nz/api-docs)
    resolves to a Notion workspace page that is not publicly shared. No OpenAPI, Swagger, GraphQL SDL
    or AsyncAPI document is published at any Hnry-controlled host.
  humanURL: https://app.hnry.io/api-docs
  baseURL: https://app.hnry.io
