aid: hnry
name: Hnry
description: >-
  Hnry is a New Zealand-founded financial administration and accounting service for sole traders,
  contractors and freelancers, operating in New Zealand, Australia and the United Kingdom. Customers
  are issued a dedicated "Hnry Account" bank account; every payment that lands in it is automatically
  split — income tax, GST/VAT, ACC levies, Medicare levy and student loan repayments are calculated,
  deducted and paid to the revenue authority in real time, and the remainder is passed straight
  through to the customer. On top of that payment rail Hnry runs invoicing, invoice chasing, expense
  capture and review, allocations to savings/investments/charities, business reporting, tax filing
  and a Hnry Business Mastercard. Pricing is a single usage-based fee of 1% of each inbound payment
  plus tax, annually capped. The platform is a Rails application at app.hnry.io with a REST API that
  backs the mobile apps and a public Zapier integration; the API reference at app.hnry.io/api-docs
  and the "Developer Platform" workspace page are both credential-gated, so no machine-readable
  contract is published.
