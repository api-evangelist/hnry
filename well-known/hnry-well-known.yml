note: >-
  Every /.well-known/ path probed returned 404 on all four Hnry hosts, so NO WellKnown pointer is
  emitted in apis.yml — a 404 sweep is a measured absence, not a presence. Two real documents were
  found off the well-known path and both are wired: (1) https://app.hnry.io/security.txt returns
  200 with valid RFC 9116 fields — Hnry serves security.txt from the WEB ROOT, not
  /.well-known/security.txt, which 404s everywhere, so a scanner checking only the standard path
  scores Hnry as having no disclosure program when it has one; the file is saved verbatim as
  hnry-security.txt and wired as type SecurityTxt. (2) https://hnry.co.uk/llms.txt returns 200
  text/plain with a well-formed llms.txt, saved verbatim to llms/hnry-llms.txt and wired as type
  LLMsTxt; hnry.co.nz and hnry.com.au both 404 that path, so the UK site is the only jurisdiction
  publishing one.
